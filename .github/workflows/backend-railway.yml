name: Backend Main Railway

on:
  push:
    branches: [main, master]
    paths:
      - 'BoraApi/**'
      - '.github/workflows/backend-railway.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'BoraApi/**'
      - '.github/workflows/backend-railway.yml'

permissions:
  contents: read

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: BoraApi

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BoraApi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build application
        run: npm run build

  deploy-production:
    name: Deploy Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BoraApi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: node ./node_modules/typeorm/cli.js migration:run -d dist/data-source.js
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway (Production)
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_NAME }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
